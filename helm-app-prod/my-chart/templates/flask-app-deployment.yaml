apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-app-deployment-prod
  annotations:
   argocd-image-updater.argoproj.io/image-list: dvir-demo=ghcr.io/dvirmoyal/dvir-demo
   argocd-image-updater.argoproj.io/dvir-demo.update-strategy: semver
   argocd-image-updater.argoproj.io/dvir-demo.allow-tags: "regexp:^([2-9][0-9]*|[1-9][0-9]+)\\.[0-9]+\\.[0-9]+$"

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-my-flaskapp-prod
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-my-flaskapp-prod
    spec:
      serviceAccountName: vault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MYSQL_HOST
              value: {{ .Values.mysql.host | quote }}
            - name: MYSQL_DATABASE
              value: "worldofgame"
            - name: MYSQL_PORT
              value: "3306"
            - name: VAULT_ADDR
              value: 'http://vault.dvir-app.svc.cluster.local:8200'
            - name: JWT_PATH
              value: '/var/run/secrets/kubernetes.io/serviceaccount/token'
